name: Build Qalam Studio APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'release/**'
      - 'qalam_studio_flutter/release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Build Release APK
        working-directory: qalam_studio_flutter
        run: |
          chmod +x ./build.sh
          ./build.sh
          flutter analyze lib/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qalam-studio-apk
          path: qalam_studio_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit Release APK to Repository
        run: |
          cp -f qalam_studio_flutter/build/app/outputs/flutter-apk/app-release.apk /tmp/qalam-release.apk
          git checkout -- .
          git clean -fd qalam_studio_flutter/assets/fonts || true
          git pull --rebase origin main
          mkdir -p release qalam_studio_flutter/release
          cp -f /tmp/qalam-release.apk release/qalam-studio.apk
          cp -f /tmp/qalam-release.apk qalam_studio_flutter/release/qalam-studio.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/qalam-studio.apk qalam_studio_flutter/release/qalam-studio.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: build updated release APK [skip ci]"
            git push origin main
          fi
