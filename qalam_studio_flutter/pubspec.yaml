name: qalam_studio
description: Offline-first Android graphic design, Urdu/English document editor, layer overlay, and batch studio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2
  image: ^4.2.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.2
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
